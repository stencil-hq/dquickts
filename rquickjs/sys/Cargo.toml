[package]
name = "rquickjs-sys"
version = "0.14.0"
authors = ["Mees Delzenne <mees.delzenne@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "QuickJS bindings for rquickjs"
keywords = ["quickjs", "ecmascript", "javascript", "es6", "es2020"]
categories = ["external-ffi-bindings"]
repository = "https://github.com/stencil-hq/dquickts"
publish = false

[build-dependencies]
cc = "1"

[build-dependencies.bindgen-rs]
package = "bindgen"
version = "0.72"
optional = true

[build-dependencies.pretty_env_logger]
version = "0.5"
optional = true

[features]
bindgen = ["bindgen-rs"]

# Debug logging
logging = ["pretty_env_logger"]
# Special case for updating bundled bindings
update-bindings = ["bindgen"]

# Enable QuickJS dumps
dump-bytecode = []
dump-gc = []
dump-gc-free = []
dump-free = []
dump-leaks = []
dump-mem = []
dump-objects = []
dump-atoms = []
dump-shapes = []
dump-module-resolve = []
dump-promise = []
dump-read-object = []

# Disable QuickJS assertions for better performance
disable-assertions = []

# Compile the embedded Python 3.15 runtime (CONFIG_PYTHON, python/*.c) in:
# JS_InitPython, JS_EvalPython and JS_PythonImport become usable
python = []

# CPython C modules that link a system library (found with pkg-config, else
# linked by name; the self-contained C modules come with `python`)
# zlib (zlib)
python-zlib = ["python"]
# _bz2 (bzip2)
python-bz2 = ["python"]
# _lzma (liblzma)
python-lzma = ["python"]
# _sqlite3 (sqlite3)
python-sqlite3 = ["python"]
# _ssl and _hashlib (OpenSSL)
python-ssl = ["python"]
# _zstd (libzstd)
python-zstd = ["python"]
# _ctypes (libffi)
python-ctypes = ["python"]
# readline (GNU readline or libedit)
python-readline = ["python"]
# _uuid (libuuid; built without it on macOS)
python-uuid = ["python"]
