# L3 module lists for tests/py/run.py l3 (CPython v3.15.2 Lib/test).
#
# Format (INI-like):
#   - '#' starts a comment (whole line or trailing); blank lines are ignored.
#   - '[name]' starts a section; each following line is one entry.
#   - Entries in [l3a]/[l3b] are module names under the `test` package
#     (a name may be a package directory such as test_json).
#   - `run.py l3 --set l3a|l3b|all` selects the sections to run.

# Language core.
[l3a]
test_grammar
test_syntax
test_scope
test_exceptions
test_raise
test_int
test_long
test_float
test_bool
test_complex
test_str
test_bytes          # needs _testlimitedcapi (make capi-testmods), else skipped whole
test_list
test_tuple
test_dict
test_set
test_unpack
test_unpack_ex
test_augassign
test_compare
test_contains
test_iter
test_generators
test_genexps
test_listcomps
test_fstring
test_format
test_class
test_descr
test_super
test_with
test_keywordonlyarg
test_extcall
test_positional_only_arg
test_types
test_builtin
test_print
test_sort
test_enumerate
test_range
test_slice
test_coroutines
test_string_literals
test_dataclasses
test_enum

# Stdlib, in L1 corpus order.
[l3b]
test_pathlib
test_subprocess
test_json
test_re
test_collections
test_os
test_shutil
test_glob
test_time
test_struct
