test_datetime
# urllib: test_urllib2_localnet only uses local loopback servers.
# Omitted (network-only, need internet access): test_urllib2net, test_urllibnet.
test_urllib
test_urllib2
test_urllib2_localnet
test_urllib_response
# test_robotparser covers urllib.robotparser (its network test is resource-gated).
test_robotparser
test_concurrent_futures
test_statistics
test_asyncio

# Test ids (module.Class.method), classes or whole modules that are never run,
# e.g. because they hang or crash the IUT. Passed to the reporter via TESTPY_EXCLUDE.
[exclude]
