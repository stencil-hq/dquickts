# L3 module lists for tests/py/run.py l3 (CPython v3.15.2 Lib/test).
#
# Format (INI-like):
#   - '#' starts a comment (whole line or trailing); blank lines are ignored.
#   - '[name]' starts a section; each following line is one entry.
#   - Entries in [l3a]/[l3b]/[l3c] are module names under the `test` package
#     (a name may be a package directory such as test_json).
#   - `run.py l3 --set l3a|l3b|l3c|all` selects the sections to run.

# Language core.
[l3a]
test_grammar
test_syntax
test_scope
test_exceptions
test_raise
test_int
test_long
test_float
test_bool
test_complex
test_str
test_bytes          # needs _testlimitedcapi (make capi-testmods), else skipped whole
